# Appended to the inputs.conf ucc-gen generates, by additional_packaging.py.
#
# It is separate because ucc-gen owns that file: it writes the [nifi] stanza
# with every default declared in globalConfig.json, and a file of our own in
# package/default/ would replace it wholesale rather than add to it -- the
# defaults would silently disappear and an input that omitted verify_tls
# would stop verifying. Nothing here belongs in globalConfig either: these
# are file monitors, not fields of the modular input.
#
# Log file monitors, disabled by default: enable the ones that apply and fix
# the path first. The official NiFi container keeps its logs in
# /opt/nifi/nifi-current/logs/, not /opt/nifi/logs/, and a package install
# puts them wherever NIFI_HOME points.
[monitor:///opt/nifi/nifi-current/logs/nifi-app*.log]
disabled = true
sourcetype = nifi:log:app
#index = default
#_TCP_ROUTING = <splunk_destination>

[monitor:///opt/nifi/nifi-current/logs/nifi-user*.log]
disabled = true
sourcetype = nifi:log:user
#index = default
#_TCP_ROUTING = <splunk_destination>

[monitor:///opt/nifi/nifi-current/logs/nifi-bootstrap*.log]
disabled = true
sourcetype = nifi:log:bootstrap
#index = default
#_TCP_ROUTING = <splunk_destination>

# HTTP access log for the API and UI, in NCSA combined format.
[monitor:///opt/nifi/nifi-current/logs/nifi-request*.log]
disabled = true
sourcetype = nifi:log:request
#index = default
#_TCP_ROUTING = <splunk_destination>

# Records which deprecated components and features the instance is still
# using. This is the log that matters when planning a move to NiFi 2.x.
[monitor:///opt/nifi/nifi-current/logs/nifi-deprecation*.log]
disabled = true
sourcetype = nifi:log:deprecation
#index = default
#_TCP_ROUTING = <splunk_destination>
