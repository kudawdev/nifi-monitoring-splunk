[nifi:log:app]
# NiFi's log lines start with a logback %date; a stack trace's continuation
# lines do not. Breaking only before a timestamped line keeps each trace with
# the event that raised it. Measured on a clean NiFi 2.11 start: 1014 of 1311
# lines in nifi-app.log are continuations, so with a plain ([\r\n]+) breaker
# 77% of the file became separate events with no timestamp and no level.
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})
SHOULD_LINEMERGE = false
MAX_TIMESTAMP_LOOKAHEAD = 30
NO_BINARY_CHECK = true
# A stack trace can be long; the 10k default would cut it and swallow the
# following event.
TRUNCATE = 0
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
TIME_PREFIX = ^
category = Custom
pulldown_type = true
EXTRACT-level = \d+\-\d+\-\d+\s\d+\:\d+\:\d+[\,\d]+\s(?<level>\w+)

