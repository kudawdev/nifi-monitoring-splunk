[nifi:log:request]
# NiFi's request log is NCSA combined, byte for byte the same shape as
# Splunk's own access_combined:
#   172.17.0.1 - admin [24/Aug/2026:19:08:31 +0000] "GET /nifi-api/flow/status
#   HTTP/2.0" 200 364 "" "curl/8.18.0"
# Reuse Splunk's core extraction rather than restating that regex. Unlike the
# other NiFi logs this one carries its own timestamp, so the event time is the
# request time rather than the collection time.
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
TIME_PREFIX = \[
MAX_TIMESTAMP_LOOKAHEAD = 32
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Web
pulldown_type = true
REPORT-access = access-extractions

[nifi:log:deprecation]
# Same logback pattern as the other NiFi logs, verified identical between
# 1.23.2 and 2.11.0. This is the log that names the deprecated components an
# instance still uses, so it is the input for migration reporting.
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})
SHOULD_LINEMERGE = false
MAX_TIMESTAMP_LOOKAHEAD = 30
NO_BINARY_CHECK = true
TRUNCATE = 0
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
TIME_PREFIX = ^
category = Custom
pulldown_type = true
EXTRACT-level = \d+\-\d+\-\d+\s\d+\:\d+\:\d+[\,\d]+\s(?<level>\w+)

[nifi:api:flow_metrics]
DATETIME_CONFIG = CURRENT
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Structured
pulldown_type = true
# One event per sample, already flattened by the TA: /flow/metrics/json
# returns Prometheus' model with labelNames and labelValues as parallel
# arrays, which INDEXED_EXTRACTIONS cannot correlate. Each event carries
# metric_name, metric_value and the sample's labels as fields.

[nifi:api:bulletin_board]
DATETIME_CONFIG = CURRENT
INDEXED_EXTRACTIONS = json
KV_MODE = none
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
# A bulletin carries the stack trace of whatever failed, which can be long.
TRUNCATE = 0
NO_BINARY_CHECK = true
category = Structured
pulldown_type = true
# Map the bulletin board's shape onto the field names the NIFI datamodel
# already uses for SiteToSiteBulletinReportingTask events, so both sources
# feed the same dashboards. bulletinGroupName and bulletinGroupPath have no
# equivalent here: the board does not resolve the group's name or path, only
# its id. sourceType and stackTrace exist from NiFi 2.0 onwards.
FIELDALIAS-bulletin_category = "bulletin.category" AS bulletinCategory
FIELDALIAS-bulletin_group_id = "bulletin.groupId" AS bulletinGroupId
FIELDALIAS-bulletin_level = "bulletin.level" AS bulletinLevel
FIELDALIAS-bulletin_source_name = "bulletin.sourceName" AS bulletinSourceName
FIELDALIAS-bulletin_source_id = "bulletin.sourceId" AS bulletinSourceId
FIELDALIAS-bulletin_source_type = "bulletin.sourceType" AS bulletinSourceType
FIELDALIAS-bulletin_message = "bulletin.message" AS bulletinMessage
# nodeAddress is only populated on a cluster, where it names the node that
# raised the bulletin; a standalone NiFi omits it entirely.
FIELDALIAS-bulletin_node = "bulletin.nodeAddress" AS bulletinNodeAddress
# The event time is the collection time, as it is for every other sourcetype
# in this TA. bulletin.timestamp is a wall clock without a date ("18:44:32
# UTC") and so unusable; bulletin.timestampIso is the real thing but only
# exists from NiFi 2.0, so it cannot drive TIMESTAMP_FIELDS for every
# supported version. Both are indexed as fields.

