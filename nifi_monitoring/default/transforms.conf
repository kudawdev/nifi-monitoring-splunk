[instance]
batch_index_query = 0
case_sensitive_match = 1
default_match = standalone
min_matches = 1
collection = instance
external_type = kvstore
fields_list = _key, host, cluster, heap_threshold, heap_threshold_critical, repo_threshold, repo_threshold_critical, backpressure_threshold, bulletin_threshold


# The status-history metrics the Components view offers, with a label and a
# unit. Replaces the fieldDescriptors the TA used to repeat in every event (R-3).
[nifi_status_metrics]
filename = nifi_status_metrics.csv
