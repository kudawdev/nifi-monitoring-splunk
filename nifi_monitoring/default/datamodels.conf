[NIFI]
# The dashboards query this model with `tstats ... from datamodel=NIFI.*`,
# which only performs as intended against an accelerated model; without
# acceleration those searches fall back to a raw search over the summary
# range. Acceleration is therefore on, matching what the panels already
# assume.
#
# Cost: a tsidx summary per bucket in the range below. Shorten
# acceleration.earliest_time if the storage matters more than the history,
# or set acceleration = false to trade panel latency for disk.
acceleration = true
acceleration.earliest_time = -7d
acceleration.backfill_time = -7d
acceleration.max_time = 3600
acceleration.poll_buckets_until_maxtime = true
acceleration.hunk.dfs_block_size = 0
