[NIFI]
# Acceleration ships OFF, and that is a packaging constraint rather than a
# preference: AppInspect's precert mode fails any app that distributes an
# accelerated datamodel (check_for_datamodel_acceleration), so shipping
# `true` means the app cannot be published.
#
# The dashboards query this model with `tstats ... from datamodel=NIFI.*`.
# Without acceleration those searches still return the right rows -- they
# fall back to a raw search over the range -- but they get slower as the
# index grows. Enabling acceleration is the single biggest thing an operator
# can do for panel latency.
#
# To enable it: Settings > Data models > NIFI > Edit > Edit Acceleration >
# tick Accelerate. doc/upgrading.md has the walkthrough and the disk cost.
#
# The settings below are the values the panels were designed around. They are
# inert while acceleration is false, and become the starting point the moment
# an operator turns it on.
acceleration = false
acceleration.earliest_time = -7d
acceleration.backfill_time = -7d
acceleration.max_time = 3600
acceleration.poll_buckets_until_maxtime = true
acceleration.hunk.dfs_block_size = 0
