# The index the app looks in by default (see the index_nifi macro).
#
# Shipping it means a fresh install has somewhere to put NiFi data and the
# dashboards work without first creating an index by hand. If your data
# already lives elsewhere, leave this alone and override index_nifi instead.
[nifi]
homePath = $SPLUNK_DB/nifi/db
coldPath = $SPLUNK_DB/nifi/colddb
thawedPath = $SPLUNK_DB/nifi/thaweddb
