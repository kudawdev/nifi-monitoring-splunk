# Where this app looks for NiFi data.
#
# Every dashboard and every datamodel constraint goes through this macro, so
# it is the one place to point the app at your index.
#
# This used to be `index=*`, which made every panel and every datamodel
# acceleration scan every event index on the instance. That is the whole
# reason this macro exists as a single point of control.
#
# If your NiFi data lands somewhere else, override it without editing this
# file: create local/macros.conf with
#
#   [index_nifi]
#   definition = index=your_index
#
# The "Internal Monitoring" page reports which indexes actually hold NiFi
# data, so you do not have to guess.
[index_nifi]
definition = index=nifi
iseval = 0


# ---------------------------------------------------------------------------
# Health and thresholds.
#
# One definition, used by every view and every alert, so a panel and an alert
# can never disagree about whether an instance is healthy. Override any of
# them in local/macros.conf.
# ---------------------------------------------------------------------------

# Seconds between polls when an instance's input interval cannot be read
# (the push path has no input, and | rest needs list_inputs).
[nifi_default_interval]
definition = 60
iseval = 0

# How many intervals without data make an instance "stale".
[nifi_stale_factor]
definition = 3
iseval = 0

# Heap used, % of max heap.
[nifi_threshold_heap]
definition = 85
iseval = 0

[nifi_threshold_heap_critical]
definition = 95
iseval = 0

# Repository used, % of its volume.
[nifi_threshold_repo]
definition = 80
iseval = 0

[nifi_threshold_repo_critical]
definition = 90
iseval = 0

# Connection fill, % of its backpressure object or size limit.
[nifi_threshold_backpressure]
definition = 80
iseval = 0

# ERROR bulletins in nifi_recent_window that fire the bulletin alert.
[nifi_threshold_bulletins]
definition = 5
iseval = 0

# ERROR bulletins in nifi_recent_window that make an instance degraded. 1
# means any; raise it for a NiFi whose flows log errors routinely.
[nifi_threshold_bulletins_degraded]
definition = 1
iseval = 0

# How far ahead NiFi's backpressure prediction counts as imminent, seconds.
[nifi_backpressure_horizon]
definition = 3600
iseval = 0

# How many consecutive samples over the heap threshold the sustained-heap
# alert waits for, so one GC spike does not page anyone.
[nifi_heap_sustained_samples]
definition = 3
iseval = 0

# What "now" means for the fleet's health and the bulletin counts: the last
# this much of data. A relative time, as earliest= takes it.
[nifi_recent_window]
definition = -15m
iseval = 0

# The thresholds that apply to each row, as fields: an instance's own column
# in the instance lookup when it has one, the macro otherwise. tonumber()
# because an unlisted host can come back from the lookup with its
# default_match ("standalone") in every column, and that must fall back too.
# Adds heap_warn, heap_crit, repo_warn, repo_crit, backpressure_warn and
# bulletin_limit.
[nifi_thresholds]
definition = eval heap_warn = coalesce(tonumber(heap_threshold), `nifi_threshold_heap`), heap_crit = coalesce(tonumber(heap_threshold_critical), `nifi_threshold_heap_critical`), repo_warn = coalesce(tonumber(repo_threshold), `nifi_threshold_repo`), repo_crit = coalesce(tonumber(repo_threshold_critical), `nifi_threshold_repo_critical`), backpressure_warn = coalesce(tonumber(backpressure_threshold), `nifi_threshold_backpressure`), bulletin_limit = coalesce(tonumber(bulletin_threshold), `nifi_threshold_bulletins`)
iseval = 0

# The same, for results that carry a host but not its lookup row.
[nifi_instance_thresholds]
definition = lookup instance host OUTPUT heap_threshold heap_threshold_critical repo_threshold repo_threshold_critical backpressure_threshold bulletin_threshold | `nifi_thresholds`
iseval = 0

# Every repository in a nifi:api:system_diagnostics event, one value per
# repository as "type|identifier|used bytes|total bytes". Content and
# provenance are arrays -- NiFi can have several of each -- and reading them
# with latest() showed one of them, unnamed (D-R).
[nifi_repositories]
definition = eval _c = mvzip(mvzip('systemDiagnostics.aggregateSnapshot.contentRepositoryStorageUsage{}.identifier', 'systemDiagnostics.aggregateSnapshot.contentRepositoryStorageUsage{}.usedSpaceBytes', "|"), 'systemDiagnostics.aggregateSnapshot.contentRepositoryStorageUsage{}.totalSpaceBytes', "|"), _p = mvzip(mvzip('systemDiagnostics.aggregateSnapshot.provenanceRepositoryStorageUsage{}.identifier', 'systemDiagnostics.aggregateSnapshot.provenanceRepositoryStorageUsage{}.usedSpaceBytes', "|"), 'systemDiagnostics.aggregateSnapshot.provenanceRepositoryStorageUsage{}.totalSpaceBytes', "|"), repository = mvappend(mvmap(_c, "content|" . _c), mvmap(_p, "provenance|" . _p), "flowfile|default|" . 'systemDiagnostics.aggregateSnapshot.flowFileRepositoryStorageUsage.usedSpaceBytes' . "|" . 'systemDiagnostics.aggregateSnapshot.flowFileRepositoryStorageUsage.totalSpaceBytes') | fields - _c _p
iseval = 0

# Turns per-host facts into health. Expects, per row: host, last_seen,
# interval, heap_pct, worst_repo_pct, invalid, sync_failure, bulletin_errors
# (any of them may be null) and the thresholds `nifi_thresholds` adds. Adds
# health (ok, degraded, critical, stale, no_data), health_rank (0 = worst,
# for sorting), health_reason, and heap_severity / repo_severity (ok,
# warning, critical, none) so a panel can colour a value by the threshold
# that applies to its instance rather than by a number written in the view.
[nifi_health]
definition = eval interval = coalesce(interval, `nifi_default_interval`), age = now() - last_seen, _heap = coalesce(heap_pct, 0), _repo = coalesce(worst_repo_pct, 0), heap_severity = case(isnull(heap_pct), "none", _heap >= heap_crit, "critical", _heap >= heap_warn, "warning", true(), "ok"), repo_severity = case(isnull(worst_repo_pct), "none", _repo >= repo_crit, "critical", _repo >= repo_warn, "warning", true(), "ok"), health = case(isnull(last_seen), "no_data", age > interval * `nifi_stale_factor`, "stale", heap_severity == "critical" OR repo_severity == "critical", "critical", heap_severity == "warning" OR repo_severity == "warning" OR coalesce(invalid, 0) > 0 OR coalesce(sync_failure, 0) > 0 OR coalesce(bulletin_errors, 0) >= `nifi_threshold_bulletins_degraded`, "degraded", true(), "ok"), health_rank = case(health == "critical", 0, health == "stale", 1, health == "no_data", 1, health == "degraded", 2, true(), 3), health_reason = case(health == "no_data", "No data in the last 24 hours", health == "stale", "No data for " . tostring(round(age), "duration") . " (interval " . interval . " s)", heap_severity != "ok" AND heap_severity != "none", "Heap " . round(_heap) . "% >= " . if(heap_severity == "critical", heap_crit, heap_warn) . "%", repo_severity != "ok" AND repo_severity != "none", worst_repo . " repository " . round(_repo) . "% >= " . if(repo_severity == "critical", repo_crit, repo_warn) . "%", coalesce(invalid, 0) > 0, invalid . " invalid component(s)", coalesce(sync_failure, 0) > 0, sync_failure . " versioned group(s) failing to sync", coalesce(bulletin_errors, 0) >= `nifi_threshold_bulletins_degraded`, bulletin_errors . " ERROR bulletin(s) recently", true(), "") | fields - _heap _repo
iseval = 0

# One row per NiFi instance with what its health is made of: when it was last
# heard from, its polling interval, its latest component counts and queue,
# heap, worst repository, version, ERROR bulletins in nifi_recent_window, its
# cluster and the thresholds that apply to it. Every instance in the instance lookup gets a row, heard from or
# not. Fixed windows on purpose: "now" does not depend on a time picker.
# Use it as | `nifi_fleet`.
[nifi_fleet]
definition = tstats latest(_time) as last_seen where `index_nifi` (sourcetype="nifi:api:*" OR sourcetype="nifi:reporting:*") earliest=-24h latest=now by host \
| append [| tstats latest(Flow_Status.controllerStatus.activeThreadCount) as threads, latest(Flow_Status.controllerStatus.flowFilesQueued) as flowfiles_queued, latest(Flow_Status.controllerStatus.bytesQueued) as bytes_queued, latest(Flow_Status.controllerStatus.runningCount) as running, latest(Flow_Status.controllerStatus.stoppedCount) as stopped, latest(Flow_Status.controllerStatus.invalidCount) as invalid, latest(Flow_Status.controllerStatus.disabledCount) as disabled, latest(Flow_Status.controllerStatus.upToDateCount) as up_to_date, latest(Flow_Status.controllerStatus.locallyModifiedCount) as locally_modified, latest(Flow_Status.controllerStatus.staleCount) as stale_groups, latest(Flow_Status.controllerStatus.syncFailureCount) as sync_failure from datamodel=NIFI.Flow_Status where earliest=`nifi_recent_window` latest=now by host] \
| append [search `index_nifi` sourcetype="nifi:api:system_diagnostics" earliest=`nifi_recent_window` latest=now | dedup host | eval heap_pct = round('systemDiagnostics.aggregateSnapshot.usedHeapBytes' * 100 / 'systemDiagnostics.aggregateSnapshot.maxHeapBytes', 1), nifi_version = 'systemDiagnostics.aggregateSnapshot.versionInfo.niFiVersion', java_version = 'systemDiagnostics.aggregateSnapshot.versionInfo.javaVersion', uptime = 'systemDiagnostics.aggregateSnapshot.uptime' | `nifi_repositories` | mvexpand repository | eval _r = split(repository, "|"), repo_pct = round(tonumber(mvindex(_r, 2)) * 100 / tonumber(mvindex(_r, 3)), 1), repo_name = mvindex(_r, 0) . " · " . mvindex(_r, 1) | sort 0 - repo_pct | dedup host | rename repo_pct as worst_repo_pct, repo_name as worst_repo | fields host heap_pct worst_repo_pct worst_repo nifi_version java_version uptime] \
| append [| tstats count as bulletin_errors from datamodel=NIFI.Bulletins where Bulletins.bulletinLevel="ERROR" earliest=`nifi_recent_window` latest=now by host] \
| append [| inputlookup instance | fields host cluster heap_threshold heap_threshold_critical repo_threshold repo_threshold_critical backpressure_threshold bulletin_threshold | eval configured = 1] \
| append [| rest splunk_server=local count=0 /servicesNS/-/-/data/inputs/nifi | eval host = coalesce(host, title) | fields host interval] \
| stats max(last_seen) as last_seen, max(interval) as interval, max(threads) as threads, max(flowfiles_queued) as flowfiles_queued, max(bytes_queued) as bytes_queued, max(running) as running, max(stopped) as stopped, max(invalid) as invalid, max(disabled) as disabled, max(up_to_date) as up_to_date, max(locally_modified) as locally_modified, max(stale_groups) as stale_groups, max(sync_failure) as sync_failure, max(heap_pct) as heap_pct, max(worst_repo_pct) as worst_repo_pct, values(worst_repo) as worst_repo, values(nifi_version) as nifi_version, values(java_version) as java_version, values(uptime) as uptime, max(bulletin_errors) as bulletin_errors, values(cluster) as cluster, max(configured) as configured, max(heap_threshold) as heap_threshold, max(heap_threshold_critical) as heap_threshold_critical, max(repo_threshold) as repo_threshold, max(repo_threshold_critical) as repo_threshold_critical, max(backpressure_threshold) as backpressure_threshold, max(bulletin_threshold) as bulletin_threshold by host \
| where isnotnull(last_seen) OR configured == 1 \
| fillnull value=0 bulletin_errors \
| fillnull value="—" cluster \
| `nifi_thresholds` \
| `nifi_health`
iseval = 0
