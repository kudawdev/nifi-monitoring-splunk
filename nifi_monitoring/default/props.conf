# Every NiFi sourcetype gets its instance's cluster from the inventory.
# OUTPUT names the field on purpose: the lookup also holds the per-instance
# thresholds, and with default_match = standalone a bare OUTPUT would stamp
# "standalone" into every one of them on every event of an unlisted host.
[nifi:log:app]
LOOKUP-instance = instance host OUTPUT cluster

[nifi:log:bootstrap]
LOOKUP-instance = instance host OUTPUT cluster

[nifi:log:user]
LOOKUP-instance = instance host OUTPUT cluster


