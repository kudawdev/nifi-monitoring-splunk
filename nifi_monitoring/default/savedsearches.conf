# Alerts shipped with the app.
#
# All disabled: an app must not start alerting the moment it is installed,
# and AppInspect holds it to that. Enable the ones you want in Settings >
# Searches, reports, and alerts (app: nifi_monitoring), and add the actions
# (email, webhook...) there -- none ship, so none fire anywhere by default.
#
# Every condition reads the same macros the panels do (`nifi_fleet`,
# `nifi_health`, `nifi_threshold_*`), so an alert and a panel never disagree.
# Change a threshold in local/macros.conf and both follow.
#
# Each alert triggers once per offending host (digest off) and is throttled
# per host, so one bad instance does not mute the others.

[NiFi - Instance without data]
description = An instance in the inventory has sent nothing for more than nifi_stale_factor polling intervals
search = | `nifi_fleet` | search health="stale" OR health="no_data" | table host cluster health health_reason last_seen
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h

[NiFi - Repository filling up]
description = A content, provenance or flowfile repository is at or above the instance's repo_threshold, or nifi_threshold_repo
search = | `nifi_fleet` | where worst_repo_pct >= repo_warn | table host cluster worst_repo worst_repo_pct repo_warn
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 7,22,37,52 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 4h

[NiFi - Sustained high heap]
description = Heap at or above the instance's heap_threshold, or nifi_threshold_heap, in its last nifi_heap_sustained_samples samples
search = `index_nifi` sourcetype="nifi:api:system_diagnostics" \
| eval heap = round('systemDiagnostics.aggregateSnapshot.usedHeapBytes' * 100 / 'systemDiagnostics.aggregateSnapshot.maxHeapBytes', 1) \
| sort 0 host - _time | streamstats count as n by host | where n <= `nifi_heap_sustained_samples` \
| stats count as samples, min(heap) as lowest, max(heap) as highest by host \
| `nifi_instance_thresholds` \
| where samples >= `nifi_heap_sustained_samples` AND lowest >= heap_warn
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h

[NiFi - ERROR bulletin spike]
description = More ERROR bulletins in nifi_recent_window than the instance's bulletin_threshold, or nifi_threshold_bulletins
search = | tstats count from datamodel=NIFI.Bulletins where Bulletins.bulletinLevel="ERROR" earliest=`nifi_recent_window` latest=now by host \
| `nifi_instance_thresholds` \
| where count > bulletin_limit
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 30m

[NiFi - Backpressure]
description = A connection at or above the instance's backpressure_threshold, or nifi_threshold_backpressure, of its limit, or predicted to reach it within nifi_backpressure_horizon. Needs flow metrics (endpoint_flow_metrics)
search = `index_nifi` sourcetype="nifi:api:flow_metrics" component_type="Connection" \
  metric_name IN ("nifi_percent_used_count", "nifi_percent_used_bytes", "nifi_time_to_count_backpressure_prediction", "nifi_time_to_bytes_backpressure_prediction") \
| stats latest(metric_value) as value, latest(source_name) as source, latest(destination_name) as destination by host component_id metric_name \
| eval used = if(like(metric_name, "nifi_percent_used_%"), value, null()), eta = if(like(metric_name, "nifi_time_to_%") AND value > 0, value, null()) \
| stats max(used) as used, min(eta) as eta_ms, values(source) as source, values(destination) as destination by host component_id \
| `nifi_instance_thresholds` \
| where used >= backpressure_warn OR eta_ms < `nifi_backpressure_horizon` * 1000
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host,component_id
alert.suppress.period = 1h

[NiFi - Cluster node disconnected]
description = A node of a NiFi cluster reports a status other than CONNECTED
search = | tstats latest(Cluster_Nodes.status) as status from datamodel=NIFI.Cluster_Nodes by host Cluster_Nodes.node \
| rename Cluster_Nodes.node as node | where status != "CONNECTED"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = host,node
alert.suppress.period = 30m

[NiFi - Versioned flow sync failure]
description = A versioned process group cannot sync with its registry (syncFailureCount > 0)
search = | `nifi_fleet` | where sync_failure > 0 | table host cluster sync_failure
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 12,27,42,57 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 4h

[NiFi - TA HTTP errors]
description = The modular input could not log in to NiFi, was refused (403) or got a 5xx. A 401 on a data request is not counted: it is an expired token, renewed on the spot
search = index=_internal sourcetype=splunkd component=ExecProcessor "nifi.py" "status_code:" \
| rex "status_code: (?<status_code>\d+)" | rex "url: (?<url>\S+)" \
| eval login = if(searchmatch("get_token"), 1, 0) \
| where (login == 1 AND tonumber(status_code) >= 400) OR status_code == "403" OR tonumber(status_code) >= 500 \
| eval status_code = if(login == 1, "login " . status_code, status_code) \
| stats count, latest(url) as url by status_code
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = 3,18,33,48 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = status_code
alert.suppress.period = 1h
