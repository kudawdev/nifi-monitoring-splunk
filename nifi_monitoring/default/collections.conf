# The NiFi instances this app monitors: one row per instance, with the
# cluster it belongs to.
#
# The threshold columns are optional and override, for that instance only,
# the nifi_threshold_* macro of the same meaning. Empty means "use the
# macro". They are percentages, except bulletin_threshold, a count.
[instance]
field.host = string
field.cluster = string
field.heap_threshold = number
field.heap_threshold_critical = number
field.repo_threshold = number
field.repo_threshold_critical = number
field.backpressure_threshold = number
field.bulletin_threshold = number
replicate = true
