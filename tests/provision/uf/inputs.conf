# Enables the monitor stanzas the TA ships, which are disabled by default
# because the TA is normally installed on the Splunk side, where NiFi's log
# directory does not exist.
#
# This file deliberately only flips `disabled`, sets the index and pins the
# host: the paths and sourcetypes come from the TA's own default/inputs.conf,
# so this profile proves the shipped paths are right (defect B-21 was that
# they were not) and that the five sourcetypes route as declared.
#
# Pinning the host models the supported deployment, where the forwarder runs
# ON the NiFi machine and stamps that machine's name. Here it is a sidecar
# container, so without it the forwarder would stamp its own name and the app
# would see one NiFi instance as two: a row collected by REST with the
# version, and a second row collected from files with none. Anyone running
# the forwarder as a sidecar has to set this too.

[monitor:///opt/nifi/nifi-current/logs/nifi-app*.log]
disabled = false
index = nifi
host = nifi

[monitor:///opt/nifi/nifi-current/logs/nifi-user*.log]
disabled = false
index = nifi
host = nifi

[monitor:///opt/nifi/nifi-current/logs/nifi-bootstrap*.log]
disabled = false
index = nifi
host = nifi

[monitor:///opt/nifi/nifi-current/logs/nifi-request*.log]
disabled = false
index = nifi
host = nifi

[monitor:///opt/nifi/nifi-current/logs/nifi-deprecation*.log]
disabled = false
index = nifi
host = nifi
