# TA input for the integration environment.
#
# run.sh rewrites api_url / auth_type / username / password from the
# selected profile before the stack comes up, so the values here are the
# unsecured defaults.

[nifi://nifi]
api_url = http://nifi:8080/nifi-api/
auth_type = none
endpoint_flow_status = 1
endpoint_system_diagnostics = 1
endpoint_site_to_site = 1
host = nifi
index = main
interval = 60
