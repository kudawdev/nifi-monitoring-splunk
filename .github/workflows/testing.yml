name: Appinspect and Unit Test (Testing)

on: workflow_dispatch

env:
  # Measured 2026-09-21, precert, per app: nifi_monitoring 5, nifi_TA_monitoring
  # 12. The gate is per app, so it has to clear the worse one, plus the single
  # warning of headroom the old value of 8 also carried.
  #
  # The TA went from 7 to 12 with the UCC migration and all five are in
  # framework code, not ours: check_for_splunk_js and
  # check_for_splunk_js_header_and_footer_view fire on ucc-gen's own
  # entry_page.js, check_for_supported_tls on splunklib and solnlib, and
  # check_for_ucc_framework_version and check_ucc_dependencies are
  # informational ("No action required"). Errors, failures and future
  # failures are all zero and stay gated at zero.
  MAX_WARNING: 13
  APP_NAME: "NIFI Monitoring for Splunk"

jobs:
  check-apps-version:
    runs-on: ubuntu-latest
    container: kudaw/appinspect:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app versions are equal
        run: |
          set -euo pipefail
          # nifi_TA_monitoring has no app.conf in the tree any more: ucc-gen
          # generates it from globalConfig.json and package/app.manifest, so
          # those two are what has to agree with the app. The unit suite checks
          # the generator's own constant as well; here we only need the versions
          # that decide the release tag.
          app_conf="nifi_monitoring/default/app.conf"
          [ -f "$app_conf" ] || { echo "::error::missing $app_conf"; exit 1; }
          app_versions=$(awk -F= '/^version[[:space:]]*=/{gsub(/[[:space:]]/,"");print $2}' "$app_conf" | sort -u)
          [ "$(printf '%s\n' "$app_versions" | grep -c .)" -eq 1 ] \
            || { echo "::error::version differs between stanzas in $app_conf"; exit 1; }

          ta_version=$(python3 -c "import json;print(json.load(open('nifi_TA_monitoring/globalConfig.json'))['meta']['version'])")
          manifest_version=$(python3 -c "import json;print(json.load(open('nifi_TA_monitoring/package/app.manifest'))['info']['id']['version'])")
          echo "nifi_monitoring = $app_versions"
          echo "nifi_TA_monitoring = $ta_version (manifest $manifest_version)"

          count=$(printf '%s\n%s\n%s\n' "$app_versions" "$ta_version" "$manifest_version" | sort -u | grep -c .)
          if [ "$count" -eq 1 ]; then
            echo "App versions are equal"
          else
            echo "::error::App versions differ across apps"; exit 1
          fi

  appinspect:
    needs: check-apps-version
    strategy:
      matrix:
        applications: ["nifi_monitoring", "nifi_TA_monitoring"]
    runs-on: ubuntu-latest
    container: kudaw/appinspect:latest
    outputs:
      APP_VERSION: ${{ steps.get_app_id.outputs.APP_VERSION }}
      matrix: ${{ matrix.applications }}
    steps:
      - uses: actions/checkout@v4
      - name: Build nifi_TA_monitoring with ucc-gen
        # The add-on is generated. Packaging nifi_TA_monitoring/ straight from the
        # tree would inspect a directory with no app.conf, no inputs.conf and no
        # UI -- and pass (condition UI-3 of the plan).
        run: ./tests/build-ta.sh
      - name: Locate the directory to package
        id: locate
        run: |
          set -euo pipefail
          if [ "${{ matrix.applications }}" = "nifi_TA_monitoring" ]; then
            echo "DIR=output/nifi_TA_monitoring" >> $GITHUB_OUTPUT
          else
            echo "DIR=${{ matrix.applications }}" >> $GITHUB_OUTPUT
          fi
      - name: Get APP version
        id: get_app_id
        run: echo "APP_VERSION=$(grep ^version ${{ steps.locate.outputs.DIR }}/default/app.conf | awk -F '=' '{gsub(/ /,"");print $2}' | head -1)" >> $GITHUB_OUTPUT
      - run: echo ${{ steps.get_app_id.outputs.APP_VERSION }}
      - name: Slim Package
        id: slim_package
        run: slim package ${{ steps.locate.outputs.DIR }}
      - name: Slim validate
        id: slim_validate
        run: slim validate ${{ matrix.applications }}-${{ steps.get_app_id.outputs.APP_VERSION }}.tar.gz
      - name: Run AppInspect
        id: run_appinspect
        run: splunk-appinspect inspect ${{ matrix.applications }}-${{ steps.get_app_id.outputs.APP_VERSION }}.tar.gz --output-file appinspect_result.json --mode precert
      - name: Check status appinspect
        run: if [ $(jq '.summary | select(.error>0 or .failure>0 or .warning>${{ env.MAX_WARNING }})' appinspect_result.json | wc -l) -gt 0 ]; then echo "Problems detected";jq '.summary' appinspect_result.json;exit -1; else jq '.summary' appinspect_result.json;fi
      - name: Upload Package
        uses: actions/upload-artifact@v4
        #if: ${{ success() }}
        with:
          name: ${{ matrix.applications}}
          path: ${{ matrix.applications }}-${{ steps.get_app_id.outputs.APP_VERSION }}.tar.gz
          if-no-files-found: error

  unittest:
    needs: appinspect
    runs-on: ubuntu-latest
    container: kudaw/appinspect:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nifi_TA_monitoring with ucc-gen
        run: ./tests/build-ta.sh
      - name: Run unit tests
        working-directory: tests/unit
        # The generated half of the add-on -- app.conf, inputs.conf, the spec and
        # lib/ -- only exists after the build. Without this flag the checks that
        # read it skip, and a green run would mean they were never made.
        env:
          REQUIRE_BUILT_TA: "1"
        run: python3 -m unittest discover -v
  integration:
    needs: appinspect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the `ci.pull_request` list in tests/matrix.yml.
        profile: [nifi1-legacy, nifi2-current, cluster, nifi2-hec]
    steps:
      - uses: actions/checkout@v4
      - name: Run the ${{ matrix.profile }} profile
        working-directory: tests
        run: ./run.sh ${{ matrix.profile }}
