name: Release gate

# Everything a release has to pass, dispatched by hand before `make release`:
# the pull request gates (pr.yml) and all ten integration scenarios
# (integration.yml with `release`). It publishes nothing. The release itself
# -- the annotated tag v<version> on main and the GitHub Release with both
# packages -- is `make release`, driven by /cicd, so CI, /cicd and a person
# all ship the same way.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pr.yml

  integration:
    uses: ./.github/workflows/integration.yml
    with:
      profiles: release
