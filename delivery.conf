# Delivery facade configuration.

# The version's one source of truth. Both apps ship on the same version --
# main.yml fails the build when they disagree -- and the TA has no app.conf
# in the tree since ucc-gen started generating it, so the app's is the file
# everything else derives from: nifi_TA_monitoring/globalConfig.json and
# package/app.manifest are rewritten from it by `make version-sync`.
MANIFEST="nifi_monitoring/default/app.conf"

MANIFEST_FLAVOUR="app-conf"

PRODUCT_LABEL="NiFi Monitoring for Splunk"

# Ships a GitHub Release with both packaged apps attached.
PROFILE="app-splunk"

# The deliverable is the attachment: a release page with notes and no .tar.gz
# is not a release. Single quotes on purpose -- this file is sourced under
# `set -u`, where VERSION does not exist yet.
RELEASE_ASSETS='nifi_monitoring-${VERSION}.tar.gz nifi_TA_monitoring-${VERSION}.tar.gz'
