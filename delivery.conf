# Delivery facade configuration.

# The version's one source of truth. Both apps ship on the same version --
# main.yml fails the build when they disagree -- and the TA has no app.conf
# in the tree since ucc-gen started generating it, so the app's is the file
# everything else derives from: nifi_TA_monitoring/globalConfig.json and
# package/app.manifest are rewritten from it by `make version-sync`, which
# `bump` and `set-version` run themselves through POST_BUMP: bump alone used
# to leave the tree inconsistent until someone remembered the second step.
MANIFEST="nifi_monitoring/default/app.conf"
POST_BUMP="make --no-print-directory version-sync"

MANIFEST_FLAVOUR="app-conf"

PRODUCT_LABEL="NiFi Monitoring for Splunk"

# Ships a GitHub Release with both packaged apps attached.
PROFILE="app-splunk"

# The two packages `make package` builds. The TA is packaged from output/,
# where ucc-gen generates it, never from its source directory: that one has no
# app.conf and no UI, installs, does nothing, and slim does not complain (UI-3).
# PRE_PACKAGE is what generates it, so a package never ships a stale build.
APP_DIRS="nifi_monitoring output/nifi_TA_monitoring"
PRE_PACKAGE="make --no-print-directory build"

# The gate, and the image it runs in: the ones CI uses. MAX_WARNING in the
# Makefile and in the workflows has to match this, and a unit test says so.
APPINSPECT_IMAGE="kudaw/appinspect:latest"
APPINSPECT_MAX_WARNING="13"

# The deliverable is the attachment: a release page with notes and no .tar.gz
# is not a release. Single quotes on purpose -- this file is sourced under
# `set -u`, where VERSION does not exist yet.
RELEASE_ASSETS='dist/nifi_monitoring-${VERSION}.tar.gz dist/nifi_TA_monitoring-${VERSION}.tar.gz'
